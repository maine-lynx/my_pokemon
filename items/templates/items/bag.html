<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>背包 - PokMMO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f5f5f5; padding: 30px;
        }
        h1 { margin-bottom: 24px; color: #333; }
        .item-grid {
            display: flex; flex-wrap: wrap; gap: 16px;
        }
        .item-card {
            background: white; border: 2px solid #ddd; border-radius: 12px;
            padding: 20px; width: 160px; text-align: center;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }
        .item-icon { font-size: 48px; margin-bottom: 8px; }
        .item-name { font-size: 16px; font-weight: bold; color: #333; }
        .item-qty { font-size: 14px; color: #888; margin-top: 4px; }
        .item-desc { font-size: 12px; color: #aaa; margin-top: 8px; }
        .back-btn {
            display: inline-block; margin-top: 30px;
            padding: 10px 24px; background: #666; color: white;
            text-decoration: none; border-radius: 8px;
        }
        .empty-msg { color: #999; font-size: 18px; margin-top: 40px; }
    </style>
</head>
<body>
    <h1>🎒 {{ trainer.name }} 的背包</h1>

    {% if trainer_items %}
        <div class="item-grid">
            {% for ti in trainer_items %}
                <div class="item-card">
                    <div class="item-icon">{{ ti.item.icon }}</div>
                    <div class="item-name">{{ ti.item.name }}</div>
                    <div class="item-qty">× {{ ti.quantity }}</div>
                    <div class="item-desc">{{ ti.item.description }}</div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="empty-msg">背包是空的，去商店买点东西吧！</p>
    {% endif %}

    <a href="/" class="back-btn">← 返回</a>
</body>
</html>
